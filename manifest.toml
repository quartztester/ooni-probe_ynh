packaging_format = 2

id = "ooni-probe"
name = "OONI Probe"
description.en = "Measures internet censorship (web-connectivity tests only) and publishes anonymous measurements"

version = "3.31.0~ynh1"

maintainers = []

[upstream]
license = "BSD-3-Clause"
website = "https://ooni.org"
code = "https://github.com/ooni/probe-cli"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
# single instance: a single machine-global probe home and scheduler
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "not_relevant"
ram.build = "50M"
ram.runtime = "100M"

[install]
    [install.run_interval_hours]
    ask.en = "Run measurements every N hours"
    type = "number"
    default = 12

    [install.url_limit]
    ask.en = "Max URLs tested per run (0 = unlimited, not recommended)"
    type = "number"
    default = 20

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.sources]
        [resources.sources.main]
        extract = false
        rename = "ooniprobe"
        amd64.url = "https://github.com/ooni/probe-cli/releases/download/v3.31.0/ooniprobe-linux-amd64"
        amd64.sha256 = "18920caf3e79df7d74360526bf881ef8f33eb5c29a97c8d2709829bffddb62c3"
        arm64.url = "https://github.com/ooni/probe-cli/releases/download/v3.31.0/ooniprobe-linux-arm64"
        arm64.sha256 = "1b300bc0be703d212c7130b7b4a0c8a23a0ade1a1742f30e7052baa4638fc9c4"
